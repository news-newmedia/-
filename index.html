<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEWS HUB</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f5f6f8;
  color: #111;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: #111;
  color: white;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}

.search {
  flex: 1;
}

.search input {
  width: 100%;
  padding: 11px 15px;
  border-radius: 8px;
  border: none;
  outline: none;
}

.header-buttons {
  display: flex;
  gap: 8px;
}

.header-buttons button {
  border: none;
  background: #333;
  color: white;
  padding: 10px 13px;
  border-radius: 8px;
}

nav {
  background: white;
  border-bottom: 1px solid #ddd;
  overflow-x: auto;
}

.nav-inner {
  max-width: 1200px;
  margin: auto;
  display: flex;
}

.nav-inner button {
  border: none;
  background: transparent;
  padding: 14px 16px;
  white-space: nowrap;
}

.nav-inner button:hover {
  background: #f0f0f0;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px 20px 100px;
}

.hero {
  background: #111;
  color: white;
  border-radius: 14px;
  padding: 30px;
  margin-bottom: 25px;
}

.hero h1 {
  margin-top: 0;
}

.section-title {
  margin: 25px 0 15px;
}

.news-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 18px;
}

.news-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
  cursor: pointer;
}

.news-card-image {
  height: 170px;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.news-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.news-card-content {
  padding: 17px;
}

.genre {
  display: inline-block;
  font-size: 12px;
  background: #eee;
  padding: 4px 8px;
  border-radius: 5px;
  margin-bottom: 8px;
}

.news-card h3 {
  margin: 4px 0 8px;
  font-size: 18px;
}

.news-card p {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

.news-date {
  color: #999;
  font-size: 12px;
}

.empty {
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  color: #777;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 500;
  overflow-y: auto;
  padding: 30px 15px;
}

.modal-content {
  background: white;
  max-width: 750px;
  margin: auto;
  border-radius: 14px;
  padding: 25px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.close {
  border: none;
  background: #eee;
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.article-body {
  line-height: 1.9;
  white-space: pre-wrap;
  margin-top: 20px;
}

.comment {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.comment-name {
  font-weight: bold;
  cursor: pointer;
}

.comment-text {
  margin-top: 5px;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.comment-form input {
  flex: 1;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.primary {
  background: #111;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 10px 15px;
}

.secondary {
  background: #eee;
  color: #111;
  border: none;
  border-radius: 7px;
  padding: 10px 15px;
}

.profile {
  text-align: center;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #222;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 10px auto 20px;
  font-size: 35px;
}

.profile-name {
  font-size: 25px;
  font-weight: bold;
}

.user-id {
  color: #888;
  font-size: 13px;
  margin: 8px;
  word-break: break-all;
}

.profile-actions {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.form-group textarea {
  min-height: 160px;
  resize: vertical;
}

.chat-list {
  max-height: 450px;
  overflow-y: auto;
  padding: 10px;
  background: #f3f3f3;
  border-radius: 10px;
}

.chat-message {
  margin: 8px 0;
  display: flex;
}

.chat-message.mine {
  justify-content: flex-end;
}

.chat-bubble {
  max-width: 75%;
  padding: 9px 13px;
  border-radius: 12px;
  background: white;
}

.chat-message.mine .chat-bubble {
  background: #111;
  color: white;
}

.chat-name {
  font-size: 11px;
  opacity: .7;
}

.chat-input {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chat-input input {
  flex: 1;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.follow-list {
  margin-top: 20px;
}

.follow-user {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.bottom-nav {
  display: none;
}

@media (max-width: 800px) {

  .news-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .header-inner {
    flex-wrap: wrap;
  }

  .search {
    order: 3;
    width: 100%;
    flex-basis: 100%;
  }
}

@media (max-width: 600px) {

  .news-grid {
    grid-template-columns: 1fr;
  }

  .header-buttons button {
    font-size: 12px;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    z-index: 200;
  }

  .bottom-nav button {
    flex: 1;
    border: none;
    background: white;
  }
}

</style>
</head>

<body>

<input

</div>

👤

<div class="nav-inner">

<button onclick="loadNews('社会')">社会</button>
<button onclick="loadNews('世界')">世界</button>
<button onclick="loadNews('経済')">経済</button>
<button onclick="loadNews('科学')">科学</button>
<button onclick="loadNews('宇宙')">宇宙</button>
<button onclick="loadNews('AI')">AI</button>
<button onclick="loadNews('テクノロジー')">テクノロジー</button>

</button>

</nav>


<main>

<section class="hero">

<p>
いま知りたいニュースを、ひとつの場所に。
</p>

</section>


<h2 class="section-title">

</h2>

</div>

<div class="bottom-nav">

</button>

</button>

<!-- ===================== -->
<!-- ニュース詳細 -->

<div

<div class="modal-content">

<div class="modal-header">

<h2 id="articleTitle"></h2>

<button

×

<option>経済</option>

ニュースを公開

<script>

const API_URL =
"https://news-api.taka30551.workers.dev";

let allNews = [];
let currentNews = null;

let currentProfileUserId = null;
let currentChatUserId = null;


// =========================
// ユーザーID
// =========================

function getUserId() {

  let id =
    localStorage.getItem("newsHubUserId");

  if (!id) {

    id =
      "user_" +
      crypto.randomUUID();

    localStorage.setItem(
      "newsHubUserId",
      id
    );
  }

  return id;
}


// =========================
// 表示名
// =========================

function getDisplayName() {

  return (
    localStorage.getItem(
      "newsHubDisplayName"
    ) || "名無し"
  );
}


async function loadUser() {

  const userId = getUserId();

  try {

    const response =
      await fetch(
        `${API_URL}/user?userId=${encodeURIComponent(userId)}`
      );

    const data =
      await response.json();

    if (
      data.success &&
      data.user
    ) {

      localStorage.setItem(
        "newsHubDisplayName",
        data.user.displayName || "名無し"
      );

    }

  } catch (error) {

    console.log(error);

  }

}


// =========================
// ニュース
// =========================

async function loadNews(genre = "") {

  const container =
    document.getElementById(
      "newsContainer"
    );

  container.innerHTML =
    `<div class="empty">
      ニュースを読み込んでいます...
    </div>`;

  try {

    const url =
      genre
        ? `${API_URL}/news?genre=${encodeURIComponent(genre)}`
        : `${API_URL}/news`;

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("API error");
    }

    const data =
      await response.json();

    allNews =
      data.news || [];

    displayNews(allNews);

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        ニュースを取得できませんでした。
      </div>`;
  }
}


function displayNews(news) {

  const container =
    document.getElementById(
      "newsContainer"
    );

  if (!news.length) {

    container.innerHTML =
      `<div class="empty">
        現在、表示できるニュースがありません。
      </div>`;

    return;
  }

  container.innerHTML =
    news.map(item => {

      const image =
        item.image
          ? `<img src="${escapeHtml(item.image)}">`
          : "";

      return `
        <article
          class="news-card"
          onclick="openArticle('${item.id}')">

          <div class="news-card-image">
            ${image}
          </div>

          <div class="news-card-content">

            <span class="genre">
              ${escapeHtml(item.genre || "その他")}
            </span>

            <h3>
              ${escapeHtml(item.title)}
            </h3>

            <p>
              ${escapeHtml(
                item.summary ||
                item.body?.slice(0,100) ||
                ""
              )}
            </p>

            <div class="news-date">
              ${formatDate(item.createdAt)}
            </div>

          </div>

        </article>
      `;

    }).join("");
}


// =========================
// 検索
// =========================

function searchNews() {

  const word =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  if (!word) {

    displayNews(allNews);

    return;
  }

  const result =
    allNews.filter(item => {

      return (
        (item.title || "")
          .toLowerCase()
          .includes(word) ||

        (item.summary || "")
          .toLowerCase()
          .includes(word) ||

        (item.body || "")
          .toLowerCase()
          .includes(word)
      );

    });

  displayNews(result);
}


// =========================
// ニュース詳細
// =========================

async function openArticle(id) {

  currentNews =
    allNews.find(
      item => item.id === id
    );

  if (!currentNews) return;

  document.getElementById(
    "articleTitle"
  ).textContent =
    currentNews.title;

  document.getElementById(
    "articleMeta"
  ).textContent =
    `${currentNews.genre || "その他"} ・ ${formatDate(currentNews.createdAt)}`;

  document.getElementById(
    "articleBody"
  ).textContent =
    currentNews.body || "";

  document.getElementById(
    "articleModal"
  ).style.display = "block";

  await loadComments(id);
}


async function loadComments(newsId) {

  const container =
    document.getElementById(
      "comments"
    );

  container.innerHTML =
    "コメントを読み込んでいます...";

  try {

    const response =
      await fetch(
        `${API_URL}/comments?newsId=${encodeURIComponent(newsId)}`
      );

    const data =
      await response.json();

    const comments =
      data.comments || [];

    if (!comments.length) {

      container.innerHTML =
        "<p>まだコメントはありません。</p>";

      return;
    }

    container.innerHTML =
      comments.map(comment => {

        return `
          <div class="comment">

            <div
              class="comment-name"
              onclick="openProfile('${comment.userId}')">

              ${escapeHtml(
                comment.displayName ||
                "名無し"
              )}

            </div>

            <div class="comment-text">
              ${escapeHtml(comment.text)}
            </div>

          </div>
        `;

      }).join("");

  } catch (error) {

    container.innerHTML =
      "<p>コメントを取得できませんでした。</p>";

  }
}


async function postComment() {

  if (!currentNews) return;

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  try {

    const response =
      await fetch(
        `${API_URL}/comments`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            newsId:
              currentNews.id,

            userId:
              getUserId(),

            displayName:
              getDisplayName(),

            text

          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "コメントできませんでした"
      );

      return;
    }

    input.value = "";

    await loadComments(
      currentNews.id
    );

  } catch (error) {

    alert(
      "コメントを送信できませんでした"
    );

  }
}


// =========================
// マイページ
// =========================

async function openMyPage() {

  document.getElementById(
    "myPageModal"
  ).style.display = "block";

  document.getElementById(
    "myDisplayName"
  ).textContent =
    getDisplayName();

  document.getElementById(
    "myUserId"
  ).textContent =
    getUserId();

  await loadFollowing();

}


async function loadFollowing() {

  const container =
    document.getElementById(
      "followingList"
    );

  try {

    const response =
      await fetch(
        `${API_URL}/following?userId=${encodeURIComponent(getUserId())}`
      );

    const data =
      await response.json();

    const list =
      data.following || [];

    if (!list.length) {

      container.innerHTML =
        "<p>まだフォローしていません。</p>";

      return;
    }

    container.innerHTML =
      list.map(item => {

        return `
          <div
            class="follow-user"
            onclick="openProfile('${item.targetUserId}')">

            ${escapeHtml(item.targetUserId)}

          </div>
        `;

      }).join("");

  } catch (error) {

    container.innerHTML =
      "<p>フォロー情報を取得できませんでした。</p>";

  }
}


// =========================
// 表示名変更
// =========================

function openEditName() {

  document.getElementById(
    "displayNameInput"
  ).value =
    getDisplayName();

  document.getElementById(
    "nameModal"
  ).style.display = "block";
}


async function saveDisplayName() {

  const input =
    document.getElementById(
      "displayNameInput"
    );

  const name =
    input.value.trim();

  if (!name) {

    alert("表示名を入力してください");

    return;
  }

  try {

    const response =
      await fetch(
        `${API_URL}/user`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            userId:
              getUserId(),

            displayName:
              name

          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "保存できませんでした"
      );

      return;
    }

    localStorage.setItem(
      "newsHubDisplayName",
      name
    );

    document.getElementById(
      "myDisplayName"
    ).textContent =
      name;

    closeModal("nameModal");

  } catch (error) {

    alert(
      "表示名を保存できませんでした"
    );

  }
}


// =========================
// プロフィール
// =========================

async function openProfile(userId) {

  currentProfileUserId =
    userId;

  document.getElementById(
    "profileModal"
  ).style.display = "block";

  try {

    const response =
      await fetch(
        `${API_URL}/user?userId=${encodeURIComponent(userId)}`
      );

    const data =
      await response.json();

    const user =
      data.user || {};

    document.getElementById(
      "profileDisplayName"
    ).textContent =
      user.displayName ||
      "名無し";

    document.getElementById(
      "profileUserId"
    ).textContent =
      user.userId ||
      userId;

  } catch (error) {

    document.getElementById(
      "profileDisplayName"
    ).textContent =
      "名無し";

    document.getElementById(
      "profileUserId"
    ).textContent =
      userId;
  }

  const button =
    document.getElementById(
      "followButton"
    );

  button.onclick =
    () => toggleFollow(userId);
}


// =========================
// フォロー
// =========================

async function toggleFollow(userId) {

  if (userId === getUserId()) {

    alert(
      "自分自身はフォローできません"
    );

    return;
  }

  const button =
    document.getElementById(
      "followButton"
    );

  try {

    const response =
      await fetch(
        `${API_URL}/follow`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            userId:
              getUserId(),

            targetUserId:
              userId

          })
        }
      );

    const data =
      await response.json();

    if (data.success) {

      button.textContent =
        "フォロー中";

    }

  } catch (error) {

    alert(
      "フォローできませんでした"
    );

  }
}


// =========================
// チャット
// =========================

function openChatFromProfile() {

  if (!currentProfileUserId) {
    return;
  }

  if (
    currentProfileUserId ===
    getUserId()
  ) {

    alert(
      "自分とはチャットできません"
    );

    return;
  }

  currentChatUserId =
    currentProfileUserId;

  closeModal("profileModal");

  document.getElementById(
    "chatModal"
  ).style.display = "block";

  loadChat();
}


async function loadChat() {

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML =
    "チャットを読み込んでいます...";

  try {

    const response =
      await fetch(
        `${API_URL}/chat?userId=${encodeURIComponent(getUserId())}&targetUserId=${encodeURIComponent(currentChatUserId)}`
      );

    const data =
      await response.json();

    const messages =
      data.messages || [];

    if (!messages.length) {

      list.innerHTML =
        "<p>まだメッセージはありません。</p>";

      return;
    }

    list.innerHTML =
      messages.map(message => {

        const mine =
          message.userId ===
          getUserId();

        return `
          <div
            class="chat-message ${mine ? "mine" : ""}">

            <div class="chat-bubble">

              <div class="chat-name">
                ${escapeHtml(
                  message.displayName ||
                  "名無し"
                )}
              </div>

              ${escapeHtml(
                message.text
              )}

            </div>

          </div>
        `;

      }).join("");

    list.scrollTop =
      list.scrollHeight;

  } catch (error) {

    list.innerHTML =
      "<p>チャットを取得できませんでした。</p>";

  }
}


async function sendChat() {

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  try {

    const response =
      await fetch(
        `${API_URL}/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            userId:
              getUserId(),

            targetUserId:
              currentChatUserId,

            displayName:
              getDisplayName(),

            text

          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "送信できませんでした"
      );

      return;
    }

    input.value = "";

    await loadChat();

  } catch (error) {

    alert(
      "メッセージを送信できませんでした"
    );

  }
}


// =========================
// 管理者
// =========================

function openAdmin() {

  document.getElementById(
    "adminModal"
  ).style.display = "block";
}


async function createNews() {

  const token =
    document.getElementById(
      "adminToken"
    ).value;

  const title =
    document.getElementById(
      "newsTitle"
    ).value.trim();

  const summary =
    document.getElementById(
      "newsSummary"
    ).value.trim();

  const genre =
    document.getElementById(
      "newsGenre"
    ).value;

  const body =
    document.getElementById(
      "newsBody"
    ).value.trim();

  const image =
    document.getElementById(
      "newsImage"
    ).value.trim();

  if (!token || !title || !body) {

    alert(
      "管理者トークン・タイトル・本文を入力してください"
    );

    return;
  }

  try {

    const response =
      await fetch(
        `${API_URL}/admin/news`,
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${token}`

          },

          body: JSON.stringify({

            title,
            summary,
            genre,
            body,
            image

          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      alert(
        data.message ||
        "ニュースを作成できませんでした"
      );

      return;
    }

    alert(
      "ニュースを公開しました"
    );

    closeModal("adminModal");

    document.getElementById(
      "newsTitle"
    ).value = "";

    document.getElementById(
      "newsSummary"
    ).value = "";

    document.getElementById(
      "newsBody"
    ).value = "";

    document.getElementById(
      "newsImage"
    ).value = "";

    await loadNews();

  } catch (error) {

    alert(
      "ニュースを公開できませんでした"
    );

  }
}


// =========================
// モーダル
// =========================

function closeModal(id) {

  document.getElementById(
    id
  ).style.display = "none";
}


window.addEventListener(
  "click",
  event => {

    document
      .querySelectorAll(".modal")
      .forEach(modal => {

        if (event.target === modal) {

          modal.style.display =
            "none";
        }

      });

  }
);


// =========================
// 共通
// =========================

function formatDate(date) {

  if (!date) return "";

  return new Date(date)
    .toLocaleString("ja-JP");
}


function escapeHtml(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


// =========================
// 起動
// =========================

async function init() {

  await loadUser();

  const name =
    getDisplayName();

  // 初回だけ表示名設定
  if (
    name === "名無し" &&
    !localStorage.getItem(
      "newsHubNameAsked"
    )
  ) {

    localStorage.setItem(
      "newsHubNameAsked",
      "1"
    );

    document.getElementById(
      "displayNameInput"
    ).value = "";

    document.getElementById(
      "nameModal"
    ).style.display = "block";
  }

  await loadNews();
}


init();
